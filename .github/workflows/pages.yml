name: GitHub Pages

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

# Retain up to 100 pending updates without interrupting the active deployment.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .tool-versions
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site from source
        run: npm run build -- --output-clean

      - name: Verify build isolation and numerical regressions
        run: npm run test:build && npm run test:node

      - name: Prepare reusable browser fixtures
        run: npm run test:fixtures

      - name: Upload browser fixtures
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-fixtures
          include-hidden-files: true
          path: .context/test-fixtures

      - name: Upload site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  browser-tests:
    name: ${{ matrix.name }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chromium
            project: chromium
            shard: 1/2
            id: chromium-1
            name: Browser tests (chromium, shard 1/2)
          - browser: chromium
            project: chromium
            shard: 2/2
            id: chromium-2
            name: Browser tests (chromium, shard 2/2)
          - browser: firefox
            project: firefox
            shard: 1/2
            id: firefox-1
            name: Browser tests (firefox, shard 1/2)
          - browser: firefox
            project: firefox
            shard: 2/2
            id: firefox-2
            name: Browser tests (firefox, shard 2/2)
          - browser: webkit
            project: webkit
            shard: 1/4
            id: webkit-1
            name: Browser tests (webkit, shard 1/4)
          - browser: webkit
            project: webkit
            shard: 2/4
            id: webkit-2
            name: Browser tests (webkit, shard 2/4)
          - browser: webkit
            project: webkit
            shard: 3/4
            id: webkit-3
            name: Browser tests (webkit, shard 3/4)
          - browser: webkit
            project: webkit
            shard: 4/4
            id: webkit-4
            name: Browser tests (webkit, shard 4/4)
          - browser: chromium
            project: chromium-only
            shard: 1/1
            id: chromium-only
            name: Chromium-only integration tests
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .tool-versions
          cache: npm

      - name: Install dependencies and browsers
        run: |
          npm ci
          if [ "${{ matrix.browser }}" = chromium ]; then
            npx playwright install --with-deps chrome
          else
            npx playwright install --with-deps "${{ matrix.browser }}"
          fi

      - name: Install virtual display and software graphics
        run: sudo apt-get install -y xvfb xauth libgl1-mesa-dri libglx-mesa0

      - name: Download the assembled Pages artifact
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: github-pages
          path: .context/pages-artifact

      - name: Extract the artifact for both entry points
        run: |
          rm -rf dist
          mkdir dist
          tar -xf .context/pages-artifact/artifact.tar -C dist

      - name: Download reusable browser fixtures
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: browser-fixtures
          path: .context/test-fixtures

      - name: Run browser regressions
        run: |
          ORRERY_PREBUILT_FIXTURES="$PWD/.context/test-fixtures" \
            xvfb-run -a npx playwright test --project="${{ matrix.project }}" --shard="${{ matrix.shard }}"
        env:
          BROWSERS: ${{ matrix.browser }}
          ORRERY_TEST_GRAPHICS: mesa
          LIBGL_ALWAYS_SOFTWARE: 1
          PLAYWRIGHT_BLOB_OUTPUT_NAME: report-${{ matrix.id }}.zip

      - name: Retain verification and diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-results-${{ matrix.id }}
          include-hidden-files: true
          path: |
            .context/playwright-results/environment
            .context/playwright-results/**/evidence/**/*.png
            .context/playwright-results/**/evidence/**/*.json
            .context/playwright-results/**/evidence/**/*.log
            .context/playwright-results/**/trace.zip
            .context/playwright-results/**/test-failed-*.png
            .context/playwright-results/**/error-context.md

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-blob-${{ matrix.id }}
          include-hidden-files: true
          path: .context/playwright-blob

  standalone:
    name: Standalone unified tests (clean checkout)
    # This job builds its own promoted site and fixtures. It needs no build artifact.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .tool-versions
          cache: npm
      - name: Install dependencies and browser
        run: |
          npm ci
          npx playwright install --with-deps chrome
      - name: Install virtual display and software graphics
        run: sudo apt-get install -y xvfb xauth libgl1-mesa-dri libglx-mesa0
      - name: Build and verify standalone unified app
        run: |
          test ! -e dist/next
          xvfb-run -a npm run test:unified
        env:
          BROWSERS: chromium
          ORRERY_TEST_GRAPHICS: mesa
          LIBGL_ALWAYS_SOFTWARE: 1
          PLAYWRIGHT_BLOB_OUTPUT_NAME: report-standalone.zip
      - name: Retain verification and diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-results-standalone
          include-hidden-files: true
          path: |
            .context/playwright-results/environment
            .context/playwright-results/**/evidence/**/*.png
            .context/playwright-results/**/evidence/**/*.json
            .context/playwright-results/**/evidence/**/*.log
            .context/playwright-results/**/trace.zip
            .context/playwright-results/**/test-failed-*.png
            .context/playwright-results/**/error-context.md
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-blob-standalone
          include-hidden-files: true
          path: .context/playwright-blob

  report:
    name: Browser test report
    if: ${{ !cancelled() }}
    needs: [browser-tests, standalone]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .tool-versions
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Download reports
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: playwright-blob-*
          path: .context/playwright-blob
          merge-multiple: true
      - name: Merge reports
        run: npx playwright merge-reports --reporter html .context/playwright-blob
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: .context/playwright-report
      - name: Upload HTML report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-test-report
          include-hidden-files: true
          path: .context/playwright-report

  deploy:
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    needs: [build, browser-tests, standalone]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
