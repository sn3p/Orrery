name: GitHub Pages

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
    # Drafts run Chromium core only; marking a PR ready runs the full suite.
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read
  actions: read

# PR updates supersede obsolete checks; production deployments keep their queue.
# The full run a PR gets on becoming ready has its own group, so a quick
# follow-up push cannot cancel it.
concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}${{ github.event_name == 'pull_request' && (github.event.action == 'ready_for_review' || (github.event.action == 'opened' && !github.event.pull_request.draft)) && '-ready' || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
  queue: ${{ github.event_name == 'pull_request' && 'single' || 'max' }}

jobs:
  plan:
    name: Select test coverage
    timeout-minutes: 5
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.plan.outputs.code }}
      build-tests: ${{ steps.plan.outputs.build-tests }}
      build-required: ${{ steps.plan.outputs.build-required }}
      build-reused: ${{ steps.plan.outputs.build-reused }}
      groups: ${{ steps.plan.outputs.groups }}
      mode: ${{ steps.plan.outputs.mode }}
      matrix: ${{ steps.plan.outputs.matrix }}
      execution: ${{ steps.plan.outputs.execution }}
      node: ${{ steps.plan.outputs.node }}
      build: ${{ steps.plan.outputs.build }}
      browser-tests: ${{ steps.plan.outputs.browser-tests }}
      standalone: ${{ steps.plan.outputs.standalone }}
      baseline: ${{ steps.plan.outputs.baseline }}
      source-run: ${{ steps.plan.outputs.source-run }}
      source-attempt: ${{ steps.plan.outputs.source-attempt }}
      source-reports: ${{ steps.plan.outputs.source-reports }}
      previous: ${{ steps.plan.outputs.previous }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Select required groups from the actual change range
        id: plan
        run: node scripts/ci-plan.cjs
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Retain exact-revision coverage receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-plan-${{ github.run_attempt }}
          path: .context/ci-plan.json
          include-hidden-files: true

  node:
    name: Fast Node regressions
    needs: plan
    if: needs.plan.outputs.node == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .tool-versions
          cache: npm
      - name: Install dependencies
        run: npm ci
      - run: npm run test:node:fast

  build-tests:
    name: Build and CLI integration regressions
    needs: plan
    if: needs.plan.outputs.build-tests == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .tool-versions
          cache: npm
      - name: Install dependencies
        run: npm ci
      # These tests mutate dist, isolated from the artifact-producing job.
      - run: npm run build && npm run test:integration

  build:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    env:
      ORRERY_TEST_GROUPS: ${{ needs.plan.outputs.groups }}
      ORRERY_TEST_MODE: ${{ needs.plan.outputs.mode }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .tool-versions
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Require the original artifact build
        id: source
        if: needs.plan.outputs.source-run != ''
        run: node scripts/ci-reuse.cjs build
        env:
          GH_TOKEN: ${{ github.token }}
          CI_SOURCE_RUN: ${{ needs.plan.outputs.source-run }}
          CI_SOURCE_ATTEMPT: ${{ needs.plan.outputs.source-attempt }}

      - name: Reuse the exact public build
        if: needs.plan.outputs.source-run != ''
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          artifact-ids: ${{ steps.source.outputs.pages }}
          path: .context/source-pages
          merge-multiple: true
          github-token: ${{ github.token }}
          run-id: ${{ needs.plan.outputs.source-run }}

      - name: Extract the verified source build
        if: needs.plan.outputs.source-run != ''
        run: |
          rm -rf dist
          mkdir dist
          tar -xf .context/source-pages/artifact.tar -C dist

      - name: Reuse prepared fixture variants
        if: needs.plan.outputs.source-run != ''
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          artifact-ids: ${{ steps.source.outputs.fixtures }}
          path: .context/test-fixtures
          merge-multiple: true
          github-token: ${{ github.token }}
          run-id: ${{ needs.plan.outputs.source-run }}

      - name: Build site from source
        if: needs.plan.outputs.source-run == ''
        run: npm run build -- --output-clean

      - name: Prepare only missing browser fixtures
        run: npm run test:fixtures
        env:
          ORRERY_REUSE_FIXTURES: ${{ needs.plan.outputs.source-run != '' && '1' || '0' }}

      - name: Upload browser fixtures
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-fixtures
          include-hidden-files: true
          path: .context/test-fixtures

      - name: Upload site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  browser-tests:
    name: ${{ matrix.name }}
    needs: [plan, build]
    if: needs.plan.outputs.browser-tests == 'true'
    env:
      ORRERY_TEST_GROUPS: ${{ needs.plan.outputs.groups }}
      ORRERY_TEST_MODE: ${{ needs.plan.outputs.mode }}
      ORRERY_PREVIOUS_COVERAGE: ${{ needs.plan.outputs.previous }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .tool-versions
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install browser and software graphics
        uses: ./.github/actions/browser-setup
        with:
          browser: ${{ matrix.browser }}
          # One saver per browser; the other jobs only restore.
          save-cache: ${{ startsWith(matrix.shard, '1/') && matrix.project == matrix.browser }}

      - name: Download the assembled Pages artifact
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: github-pages
          path: .context/pages-artifact

      - name: Extract the artifact for both entry points
        run: |
          rm -rf dist
          mkdir dist
          tar -xf .context/pages-artifact/artifact.tar -C dist

      - name: Download reusable browser fixtures
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: browser-fixtures
          path: .context/test-fixtures

      - name: Run browser regressions
        run: |
          ORRERY_PREBUILT_FIXTURES="$PWD/.context/test-fixtures" \
            xvfb-run -a npx playwright test --project="${{ matrix.project }}" --shard="${{ matrix.shard }}"
        env:
          BROWSERS: ${{ matrix.browser }}
          ORRERY_TEST_GRAPHICS: mesa
          LIBGL_ALWAYS_SOFTWARE: 1
          PLAYWRIGHT_BLOB_OUTPUT_NAME: report-${{ matrix.id }}.zip

      - name: Retain verification and diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-results-${{ matrix.id }}
          include-hidden-files: true
          path: |
            .context/playwright-results/environment
            .context/playwright-results/**/evidence/**/*.png
            .context/playwright-results/**/evidence/**/*.json
            .context/playwright-results/**/evidence/**/*.log
            .context/playwright-results/**/trace.zip
            .context/playwright-results/**/test-failed-*.png
            .context/playwright-results/**/error-context.md

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-blob-${{ matrix.id }}
          include-hidden-files: true
          path: .context/playwright-blob

  standalone:
    name: Clean-checkout smoke (Pixi and Three)
    needs: plan
    if: needs.plan.outputs.standalone == 'true'
    # Two public-entry tests build independently; no prepared fixture download.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .tool-versions
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install browser and software graphics
        uses: ./.github/actions/browser-setup
        with:
          browser: chromium
      - name: Build and verify standalone unified app
        run: |
          test ! -e dist/next
          xvfb-run -a npm run test:unified
        env:
          BROWSERS: chromium
          ORRERY_TEST_GRAPHICS: mesa
          LIBGL_ALWAYS_SOFTWARE: 1
          PLAYWRIGHT_BLOB_OUTPUT_NAME: report-standalone.zip
      - name: Retain verification and diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-results-standalone
          include-hidden-files: true
          path: |
            .context/playwright-results/environment
            .context/playwright-results/**/evidence/**/*.png
            .context/playwright-results/**/evidence/**/*.json
            .context/playwright-results/**/evidence/**/*.log
            .context/playwright-results/**/trace.zip
            .context/playwright-results/**/test-failed-*.png
            .context/playwright-results/**/error-context.md
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-blob-standalone
          include-hidden-files: true
          path: .context/playwright-blob

  report:
    name: Browser test report
    if: ${{ !cancelled() && needs.plan.outputs.browser-tests == 'true' }}
    needs: [plan, browser-tests, standalone]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .tool-versions
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Download reports
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: playwright-blob-*
          path: .context/playwright-blob
          merge-multiple: true
      - name: Include the reused source reports
        if: needs.plan.outputs.source-run != ''
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          artifact-ids: ${{ needs.plan.outputs.source-reports }}
          path: .context/source-reports
          merge-multiple: true
          github-token: ${{ github.token }}
          run-id: ${{ needs.plan.outputs.source-run }}
      - name: Combine disjoint reports
        if: needs.plan.outputs.source-run != ''
        run: |
          mkdir -p .context/playwright-blob
          for report in .context/source-reports/*.zip; do
            cp "$report" ".context/playwright-blob/source-$(basename "$report")"
          done
      - name: Merge reports
        run: npx playwright merge-reports --reporter html .context/playwright-blob
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: .context/playwright-report
      - name: Upload HTML report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-test-report
          include-hidden-files: true
          path: .context/playwright-report

  baseline:
    name: Reused checks
    needs: plan
    if: needs.plan.outputs.baseline == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require the exact source run to pass
        id: source
        run: node scripts/ci-reuse.cjs CI --gate-only
        env:
          GH_TOKEN: ${{ github.token }}
          CI_SOURCE_RUN: ${{ needs.plan.outputs.source-run }}
          CI_SOURCE_ATTEMPT: ${{ needs.plan.outputs.source-attempt }}

  ci:
    name: CI
    timeout-minutes: 5
    if: always()
    needs: [plan, node, build, build-tests, browser-tests, standalone, baseline]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require every selected check
        run: node scripts/ci-gate.cjs
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
      - name: Recheck source attempt at the final gate
        if: needs.plan.outputs.baseline == 'true'
        run: node scripts/ci-reuse.cjs CI --gate-only
        env:
          GH_TOKEN: ${{ github.token }}
          CI_SOURCE_RUN: ${{ needs.plan.outputs.source-run }}
          CI_SOURCE_ATTEMPT: ${{ needs.plan.outputs.source-attempt }}

  deploy:
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request' && github.event_name != 'schedule' && needs.plan.outputs.code == 'true'
    needs: [plan, build, ci]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
