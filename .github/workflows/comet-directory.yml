name: Comet directory acceptance
on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  exact-data:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: sn3p/orrery-data
          ref: 53a6ce491c5b5a119236fc629e54449bf15920a5
          path: .context/producer
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .tool-versions
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: python3 .context/producer/scripts/comet_directory_candidate.py
      - run: node tests/run-comet-directory.cjs .context/producer ${{ matrix.browser }}
        env:
          CHROME_CHANNEL: chromium
